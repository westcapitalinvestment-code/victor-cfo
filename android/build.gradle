// Top-level build file where you can add configuration options common to all sub-projects/modules.

buildscript {
    
    repositories {
        google()
        mavenCentral()
    }
    dependencies {
        classpath 'com.android.tools.build:gradle:8.13.0'
        classpath 'com.google.gms:google-services:4.4.4'

        // NOTE: Do not place your application dependencies here; they belong
        // in the individual module build.gradle files
    }
}

apply from: "variables.gradle"

// Fix de raíz para "Unable to delete directory" en Windows: esta carpeta
// del proyecto vive dentro de OneDrive, y OneDrive (y/o el antivirus)
// bloquea archivos de build que Gradle acaba de crear/borrar, tumbando
// Clean Project una y otra vez sin importar qué antivirus se use. La
// solución real es sacar TODOS los archivos temporales de compilación
// (carpetas "build") de la carpeta sincronizada por completo, a una
// carpeta normal de Windows que nadie vigila en tiempo real.
def carpetaBuildExterna = new File("C:/AndroidBuilds/victor-cfo-app")

allprojects {
    buildDir = new File(carpetaBuildExterna, project.name)
    repositories {
        google()
        mavenCentral()
    }
    // Varios plugins de Capacitor (cámara, biometría, push, app) traen cada
    // uno su propia copia vieja de kotlin-stdlib-jdk7/jdk8 — desde Kotlin
    // 1.8 esas clases ya viven directo en kotlin-stdlib, así que tener las
    // dos versiones al mismo tiempo duplica clases y tumba el build
    // ("Duplicate class kotlin.jvm.jdk8..."). Se excluyen en todos los
    // módulos para que todo use la copia única de kotlin-stdlib.
    configurations.all {
        exclude group: 'org.jetbrains.kotlin', module: 'kotlin-stdlib-jdk7'
        exclude group: 'org.jetbrains.kotlin', module: 'kotlin-stdlib-jdk8'
    }
}

task clean(type: Delete) {
    delete rootProject.buildDir
}
